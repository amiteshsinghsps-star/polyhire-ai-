[project]
name = "polyhire-ml-service"
version = "1.0.0"
description = "PolyHire AI — ML pipeline service (FastAPI)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "lightgbm>=4.3.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.41.0",
    "torch>=2.2.0",
    "qdrant-client>=1.9.0",
    "faiss-cpu>=1.8.0",
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",
    "pyod>=2.0.0",
    "umap-learn>=0.5.5",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
voice = [
    "faster-whisper>=1.0.2",
]
multilingual = [
    "IndicTransToolkit>=0.1.0",
]
local-llm = [
    "llama-cpp-python>=0.2.70",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
